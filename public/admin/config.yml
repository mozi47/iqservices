backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/iq-operations
  branch: main
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: site
    label: Website Content
    files:
      - name: content
        label: All Pages
        file: content/site.json
        format: json
        fields:
          - label: Company Details
            name: company
            widget: object
            fields:
              - {label: Company name, name: name, widget: string}
              - {label: Logo text, name: short, widget: string}
              - {label: Slogan, name: slogan, widget: string}
              - {label: Registered in, name: region, widget: string}
              - {label: Company Registration Number, name: crn, widget: string}
              - {label: Registered Office Address, name: address, widget: string}
              - {label: Email, name: email, widget: string}
              - {label: Phone, name: phone, widget: string}
          - label: Home Hero
            name: hero
            widget: object
            fields:
              - {label: Headline, name: headline, widget: string}
              - {label: Sub-headline, name: sub, widget: text}
              - {label: Primary button, name: cta1, widget: string}
              - {label: Secondary button, name: cta2, widget: string}
          - label: Services
            name: services
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Home page summary, name: short, widget: text}
              - {label: About page description, name: detail, widget: text}
              - {label: What we do, name: what, widget: text}
              - {label: Example project, name: example, widget: text}
          - label: Home Intro
            name: intro
            widget: object
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Text, name: body, widget: text}
              - {label: Button, name: button, widget: string}
          - label: Why Partner With Us
            name: why
            widget: list
            fields: &tt
              - {label: Title, name: title, widget: string}
              - {label: Text, name: text, widget: text}
          - label: How We Work
            name: process
            widget: list
            fields: *tt
          - label: Bottom Banner
            name: cta
            widget: object
            fields: &cta
              - {label: Headline, name: headline, widget: string}
              - {label: Sub-headline, name: sub, widget: text}
              - {label: Button, name: button, widget: string}
          - label: About Page
            name: about
            widget: object
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Sub-headline, name: sub, widget: text}
              - {label: Overview paragraphs, name: overview, widget: list, field: {label: Paragraph, name: p, widget: text}}
              - {label: Project scope, name: projects, widget: list, fields: *tt}
              - {label: Why partner, name: why, widget: list, fields: *tt}
              - {label: Bottom Banner, name: cta, widget: object, fields: *cta}
          - label: Legal Pages
            name: legal
            widget: object
            fields:
              - {label: Privacy Policy, name: privacy, widget: text}
              - {label: Terms & Conditions, name: terms, widget: text}
